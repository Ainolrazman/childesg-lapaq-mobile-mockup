<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChildESG™ Mobile Prototype</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code Scanner Library CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-0 sm:p-4">
    <!-- Mobile Device Frame Container -->
    <div class="w-full sm:max-w-[400px] h-screen sm:h-[844px] bg-slate-50 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-8 sm:border-slate-800">
        
        <!-- Top Status Bar Mock -->
        <div class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center text-xs font-semibold shrink-0">
            <span>10:34</span>
            <div class="w-20 h-4 bg-slate-800 rounded-full mx-auto absolute left-1/2 transform -translate-x-1/2 hidden sm:block"></div>
            <div class="flex space-x-1.5 items-center">
                <span>5G</span>
                <div class="w-5 h-2.5 border border-white rounded-sm p-0.5 flex items-center">
                    <div class="w-full h-full bg-white rounded-2xs"></div>
                </div>
            </div>
        </div>
        <!-- App Header -->
        <header class="bg-white border-b border-slate-200 px-5 py-3.5 flex justify-between items-center shrink-0">
            <div>
                <span class="text-[10px] font-bold tracking-wider text-blue-600 uppercase">ChildESG™ Mobile</span>
                <h1 id="app-title" class="text-lg font-bold text-slate-900">Authentication</h1>
            </div>
            <button onclick="switchTab('auth')" class="w-9 h-9 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold text-xs hover:bg-emerald-200 transition">
                Auth
            </button>
        </header>
        <!-- Main Scrollable Screen Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto p-5 pb-24 hide-scrollbar space-y-5">
            <div class="p-4 bg-white rounded-xl shadow-sm text-center">
                <p class="text-xs text-slate-500 font-bold">Loading ChildESG™ Platform...</p>
            </div>
        </main>
        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-1 py-2 flex justify-around items-center shrink-0 z-50">
            <button onclick="switchTab('layer1')" id="nav-layer1" class="flex flex-col items-center py-1 px-1 text-emerald-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span class="text-[8px] font-medium">Home</span>
            </button>
            <button onclick="switchTab('layer3')" id="nav-layer3" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span class="text-[8px] font-medium">Children</span>
            </button>
            <button onclick="switchTab('lapaq')" id="nav-lapaq" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span class="text-[8px] font-medium">LaPaQ</span>
            </button>
            <button onclick="switchTab('school')" id="nav-school" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span class="text-[8px] font-medium">School</span>
            </button>
            <button onclick="switchTab('scanner')" id="nav-scanner" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9V5a2 2 0 012-2h4M3 15v4a2 2 0 002 2h4m10-14h4a2 2 0 012 2v4m0 6v4a2 2 0 01-2 2h-4"/></svg>
                <span class="text-[8px] font-medium">Scanner</span>
            </button>
            <button onclick="switchTab('tokens')" id="nav-tokens" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V6m0 12v-2m0 0c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-[8px] font-medium">Tokens</span>
            </button>
        </nav>
    </div>
    <!-- App JavaScript Logic -->
    <script>
        let html5QrCode = null;
        let selectedChild = 'adam'; 
        let currentAuthTab = 'login'; 
        let currentUserRole = 'parent'; // 'parent' or 'school'

        const childrenData = {
            adam: {
                name: "Adam",
                age: "8 Yrs Old",
                gender: "Boy",
                school: "SK Petaling Jaya",
                token: "#AB-34X-KEMAIH",
                height: "132.5 cm",
                haz: "+0.25 (Normal)",
                bmi: "16.1 kg/m²",
                baz: "-0.10 (Normal)",
                playTime: "90 Mins",
                tokensEarned: 5,
                ecoTokens: 3,
                nutritionTokens: 2,
                schoolTokens: 4,
                communityTokens: 2,
                rniStatus: "Balanced Target Met (100% RNI)",
                rniClaimed: false
            },
            maya: {
                name: "Maya",
                age: "5 Yrs Old",
                gender: "Girl",
                school: "Taska Permata KEMAS Petaling Jaya",
                token: "#MY-99Z-PERMATA",
                height: "108.2 cm",
                haz: "+0.10 (Normal)",
                bmi: "15.4 kg/m²",
                baz: "+0.05 (Normal)",
                playTime: "60 Mins",
                tokensEarned: 2,
                ecoTokens: 2,
                nutritionTokens: 1,
                schoolTokens: 3,
                communityTokens: 1,
                rniStatus: "Balanced Target Met (95% RNI)",
                rniClaimed: false
            }
        };
        function renderAuthPage() {
            return `
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-5 text-white shadow-lg space-y-1">
                    <span class="bg-blue-500/40 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full text-blue-300">ChildESG™ Gateway</span>
                    <h2 class="text-xl font-bold">Account Authentication</h2>
                    <p class="text-xs text-slate-300">Sign in as Parent or School Administrator</p>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-100 space-y-3">
                    <div class="flex bg-slate-100 p-1 rounded-xl">
                        <button onclick="setAuthMode('login')" id="auth-tab-login" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition ${currentAuthTab === 'login' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                            🔐 Login
                        </button>
                        <button onclick="setAuthMode('register')" id="auth-tab-register" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition ${currentAuthTab === 'register' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                            📝 Register
                        </button>
                    </div>
                    <div id="auth-form-login" class="${currentAuthTab === 'login' ? 'block' : 'hidden'} space-y-2.5">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Select Login Role</label>
                            <select id="login-role-select" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500 font-bold text-slate-800">
                                <option value="parent">👤 Parent / Guardian Account</option>
                                <option value="school">🏫 School / Teacher Administrator Account</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Username / Email</label>
                            <input type="text" placeholder="e.g. guardian123 or teacher@skpj.edu.my" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Password</label>
                            <input type="password" placeholder="••••••••" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <button onclick="handleLoginSubmit()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-700 transition mt-1">
                            Sign In → Access Dashboard
                        </button>
                    </div>
                    <div id="auth-form-register" class="${currentAuthTab === 'register' ? 'block' : 'hidden'} space-y-2.5">
                        <div class="p-2.5 bg-blue-50 rounded-lg border border-blue-100">
                            <span class="text-[10px] font-bold text-blue-700 uppercase">PDPA Consent Included</span>
                            <p class="text-[10px] text-blue-600 mt-0.5">Registration creates your account and registers PDPA hashing consent.</p>
                        </div>
                        
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Full Name</label>
                            <input type="text" placeholder="e.g. Guardian Name" class="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Mobile</label>
                                <input type="tel" placeholder="012-3456789" class="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Email</label>
                                <input type="email" placeholder="parent@example.com" class="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                        <div class="space-y-1.5 pt-1">
                            <div class="flex items-start space-x-2">
                                <input type="checkbox" id="pdpa1" checked class="mt-0.5 rounded text-blue-600 h-3 w-3">
                                <label for="pdpa1" class="text-[10px] text-slate-600">I accept the PDPA Data Protection & Anonymization Policy.</label>
                            </div>
                            <div class="flex items-start space-x-2">
                                <input type="checkbox" id="pdpa2" checked class="mt-0.5 rounded text-blue-600 h-3 w-3">
                                <label for="pdpa2" class="text-[10px] text-slate-600">I authorize tokenized health monitoring for my children.</label>
                            </div>
                        </div>
                        <button onclick="handleRegisterSubmit()" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md hover:bg-blue-700 transition mt-1">
                            ✓ Register & Proceed to Profile
                        </button>
                    </div>
                </div>
            `;
        }
        function setAuthMode(mode) {
            currentAuthTab = mode;
            switchTab('auth');
        }
        function handleLoginSubmit() {
            const roleSelect = document.getElementById('login-role-select');
            currentUserRole = roleSelect ? roleSelect.value : 'parent';

            if (currentUserRole === 'school') {
                alert("School Teacher/Admin authenticated successfully! Redirecting to School Dashboard...");
                switchTab('school');
            } else {
                alert("Parent authenticated successfully! Proceeding to Home & Parent Profile...");
                switchTab('layer1');
            }
        }
        function handleRegisterSubmit() {
            currentUserRole = 'parent';
            alert("Account registered & PDPA consent stored! Proceeding to Home & Parent Profile...");
            switchTab('layer1');
        }
        function renderLaPaQPage() {
            const child = childrenData[selectedChild];
            return `
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-5 text-white shadow-lg space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2.5">
                        <span class="bg-slate-700 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full text-blue-400">Intelligence Engine</span>
                        
                        <!-- Prominent Child Selector Dropdown -->
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[10px] text-slate-300 font-bold uppercase">Child:</span>
                            <select onchange="changeLaPaQChild(this.value)" class="bg-blue-600 text-white text-xs font-extrabold px-3 py-1.5 rounded-lg outline-none border border-blue-400 shadow-sm cursor-pointer">
                                <option value="adam" ${selectedChild === 'adam' ? 'selected' : ''}>👦 Adam (8 Yrs)</option>
                                <option value="maya" ${selectedChild === 'maya' ? 'selected' : ''}>👧 Maya (5 Yrs)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold">${child.name}'s LaPaQ RNI Intake</h2>
                        <p class="text-xs text-slate-300 mt-0.5">Recommended Nutrient Intake (RNI) compliance profile</p>
                    </div>
                    <!-- Connect / External Portal Login Button -->
                    <div class="pt-1">
                        <a href="https://lapaq.app:3000/login" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center space-x-1.5 shadow-md transition">
                            <span>🔗 Connect / Login to LaPaQ Portal</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        </a>
                    </div>
                    <!-- Balanced Diet Token Status Banner -->
                    <div id="rni-token-banner" class="p-3 bg-slate-700/60 rounded-xl border border-slate-600 flex justify-between items-center text-xs mt-2">
                        <div>
                            <p class="text-slate-300 text-[10px] font-bold uppercase">Daily RNI Diet Target</p>
                            <p class="font-bold text-emerald-400 mt-0.5">${child.rniStatus}</p>
                        </div>
                        ${child.rniClaimed 
                            ? `<span class="bg-emerald-600/30 text-emerald-300 text-[10px] px-2.5 py-1 rounded-lg font-bold border border-emerald-500/40">✓ Token Minted</span>` 
                            : `<button onclick="claimRNIToken()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold text-[10px] px-3 py-1.5 rounded-lg shadow-md transition">🥗 Claim Nutrition Token</button>`
                        }
                    </div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Energy & Calendar Time Span</h3>
                    
                    <div class="grid grid-cols-3 gap-1.5 text-center">
                        <button onclick="selectTimeSpan('1')" id="ts-1" class="py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white transition">1 Day</button>
                        <button onclick="selectTimeSpan('7')" id="ts-7" class="py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition">7 Days</button>
                        <button onclick="selectTimeSpan('30')" id="ts-30" class="py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition">30 Days</button>
                        <button onclick="selectTimeSpan('90')" id="ts-90" class="py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition">90 Days</button>
                        <button onclick="selectTimeSpan('365')" id="ts-365" class="py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition">365 Days</button>
                        <button onclick="selectTimeSpan('custom')" id="ts-custom" class="py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition">Selected Dates</button>
                    </div>
                    <div id="custom-date-picker" class="hidden pt-2 flex space-x-2">
                        <input type="date" class="w-1/2 text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg">
                        <input type="date" class="w-1/2 text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg">
                    </div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">RNI Intake Compliance (${child.name})</h3>
                        <span class="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-full">Target Met</span>
                    </div>
                    <!-- Macro & Micronutrient Progress Bars -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Calories (Energy)</span>
                            <span class="text-slate-800">1,620 / 1,800 kcal <span class="text-emerald-600 font-bold">(90%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full w-[90%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Carbohydrate</span>
                            <span class="text-slate-800">225 / 240 g <span class="text-emerald-600 font-bold">(94%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-blue-500 h-full w-[94%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Protein</span>
                            <span class="text-slate-800">42 / 45 g <span class="text-emerald-600 font-bold">(93%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-indigo-500 h-full w-[93%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Fiber</span>
                            <span class="text-slate-800">18 / 20 g <span class="text-emerald-600 font-bold">(90% Target Met)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-amber-500 h-full w-[90%]"></div>
                        </div>
                    </div>
                    <!-- Micronutrients: Vitamin A & Vitamin C -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Vitamin A</span>
                            <span class="text-slate-800">480 / 500 µg RE <span class="text-emerald-600 font-bold">(96%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-orange-500 h-full w-[96%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Vitamin C</span>
                            <span class="text-slate-800">38 / 40 mg <span class="text-emerald-600 font-bold">(95%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-rose-500 h-full w-[95%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Sodium</span>
                            <span class="text-slate-800">1,100 / 1,500 mg <span class="text-emerald-600 font-bold">(Optimal)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-teal-500 h-full w-[73%]"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-700">Calcium</span>
                            <span class="text-slate-800">680 / 800 mg <span class="text-emerald-600 font-bold">(85%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-purple-500 h-full w-[85%]"></div>
