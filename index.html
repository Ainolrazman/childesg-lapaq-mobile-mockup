        function switchTab(tabKey) {
            if (html5QrCode && tabKey !== 'scanner') {
                html5QrCode.stop().catch(() => {});
            }

            const titles = {
                layer1: "Registration (Layer 1)",
                layer2: "Parent Profile (Layer 2)",
                layer3: "Children Profile (Layer 3)",
                lapaq: "LaPaQ RNI Analytics",
                school: "School Dashboard",
                scanner: "QR Code Scanner",
                sroi: "SROI Dashboard"
            };
            document.getElementById('app-title').innerText = titles[tabKey];
            document.getElementById('app-content').innerHTML = contentData[tabKey];

            ['layer1', 'layer2', 'layer3', 'lapaq', 'school', 'scanner', 'sroi'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (btn) {
                    if (key === tabKey) {
                        btn.classList.remove('text-slate-400');
                        btn.classList.add('text-blue-600');
                    } else {
                        btn.classList.remove('text-blue-600');
                        btn.classList.add('text-slate-400');
                    }
                }
            });
        }

        function acceptRegistrationAndProceed() {
            alert("Registration & PDPA Consent completed! Proceeding to Layer 2 Parent Profile...");
            switchTab('layer2');
        }

        function registerChildAndProceed() {
            alert("Child record successfully created! Proceeding to Layer 3 Child Profile...");
            switchTab('layer3');
        }

        function selectTimeSpan(span) {
            ['1', '7', '30', '90', '365', 'custom'].forEach(s => {
                const btn = document.getElementById(`ts-${s}`);
                if (btn) {
                    if (s === span) {
                        btn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white transition";
                    } else {
                        btn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition";
                    }
                }
            });

            const customPicker = document.getElementById('custom-date-picker');
            if (span === 'custom') {
                customPicker.classList.remove('hidden');
            } else {
                customPicker.classList.add('hidden');
            }
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    document.getElementById('scan-result').innerText = `Scanned Success: ${decodedText}`;
                    html5QrCode.stop().catch(() => {});
                },
                () => {}
            ).catch(() => {
                document.getElementById('scan-result').innerText = `Camera error or permission denied.`;
            });
        }

        // Initialize default view to Layer 1 Registration
        switchTab('layer1');
    </script>
