                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Organization Partner Particulars</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="p-2.5 bg-slate-50 rounded-lg">
                            <span class="text-[10px] text-slate-400 block font-bold uppercase">Partner ID Code</span>
                            <span class="font-bold text-slate-800">PRT-9982-MY</span>
                        </div>
                        <div class="p-2.5 bg-slate-50 rounded-lg">
                            <span class="text-[10px] text-slate-400 block font-bold uppercase">Operating Zone</span>
                            <span class="font-bold text-slate-800">Petaling Utama / KL</span>
                        </div>
                    </div>
                    <button onclick="alert('Partner Profile updated!')" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold text-xs shadow hover:bg-indigo-700 transition">
                        ✓ Save Partner Profile
                    </button>
                </div>
            `;
        }

        // Partner Organization Dashboard Layer
        function renderPartnerDashboard() {
            if (currentPartnerView === 'group_detail') {
                return renderParticipantGroupDetails(activeParticipantGroup);
            }
            return `
                <div class="bg-gradient-to-br from-indigo-700 to-purple-800 rounded-2xl p-5 text-white shadow-lg space-y-2">
                    <span class="bg-indigo-500/40 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Partner Portal</span>
                    <h2 class="text-xl font-bold">Partner Organization Dashboard</h2>
                    <p class="text-xs text-indigo-100">SK Petaling Jaya & Community Centers • Active Tracking</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Attendance & Plate Metrics</h3>
                        <span class="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-full">Live Sync</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-50 p-3 rounded-lg text-center">
                            <p class="text-[10px] text-slate-400 font-bold uppercase">Attendance</p>
                            <p class="text-lg font-extrabold text-indigo-600 mt-0.5">96.8%</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-lg text-center">
                            <p class="text-[10px] text-slate-400 font-bold uppercase">Plate Compliance</p>
                            <p class="text-lg font-extrabold text-emerald-600 mt-0.5">91.4%</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <h3 class="text-xs font-bold text-indigo-700 uppercase tracking-wider border-b border-slate-100 pb-2">👥 Registered Participants</h3>
                    <div class="space-y-2">
                        <div onclick="openParticipantGroup('Year 2A (Cemerlang)')" class="p-3 bg-slate-50 hover:bg-indigo-50 rounded-lg flex justify-between items-center border border-slate-100 cursor-pointer transition">
                            <div>
                                <p class="text-xs font-bold text-slate-800">Year 2A (Cemerlang)</p>
                                <p class="text-[10px] text-slate-500">Participants: 33 • Lead: Cikgu Faridah</p>
                            </div>
                            <span class="text-[10px] bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-bold">View List →</span>
                        </div>
                        <div onclick="openParticipantGroup('Year 1A (Pintar)')" class="p-3 bg-slate-50 hover:bg-indigo-50 rounded-lg flex justify-between items-center border border-slate-100 cursor-pointer transition">
                            <div>
                                <p class="text-xs font-bold text-slate-800">Year 1A (Pintar)</p>
                                <p class="text-[10px] text-slate-500">Participants: 32 • Lead: Cikgu Aminah</p>
                            </div>
                            <span class="text-[10px] bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-bold">View List →</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function openParticipantGroup(groupName) {
            currentPartnerView = 'group_detail';
            activeParticipantGroup = groupName;
            switchTab('school');
        }

        function closeParticipantGroup() {
            currentPartnerView = 'dashboard';
            activeParticipantGroup = '';
            switchTab('school');
        }

        function renderParticipantGroupDetails(groupName) {
            const roster = participantGroups[groupName] || [];
            let html = `
                <div class="space-y-3">
                    <button onclick="closeParticipantGroup()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs py-2 px-3 rounded-xl transition flex items-center space-x-1">
                        <span>← Back to Dashboard</span>
                    </button>
                    <div class="bg-gradient-to-br from-indigo-800 to-purple-900 rounded-2xl p-4 text-white shadow-lg space-y-1">
                        <span class="bg-indigo-500/40 text-[9px] uppercase font-bold px-2 py-0.5 rounded-full">Participants Group</span>
                        <h2 class="text-lg font-bold">${groupName}</h2>
                        <p class="text-[11px] text-indigo-200">Registered Participants: ${roster.length} Active Records</p>
                    </div>
                    <div class="space-y-2">
            `;
            roster.forEach(participant => {
                html += `
                    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-slate-800">${participant.name}</p>
                            <p class="text-[10px] text-slate-500 font-mono">${participant.token}</p>
                            <p class="text-[10px] text-emerald-600 font-semibold mt-0.5">RNI: ${participant.rni} • Status: ${participant.status}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-emerald-100 text-emerald-800 text-[9px] px-2 py-1 rounded-full font-bold">${participant.attendance}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        function renderLaPaQPage() {
            const child = childrenData[selectedChild];
            return `
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-5 text-white shadow-lg space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2.5">
                        <span class="bg-slate-700 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full text-blue-400">Intelligence Engine</span>
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[10px] text-slate-300 font-bold uppercase">Child:</span>
                            <select onchange="changeLaPaQChild(this.value)" class="bg-blue-600 text-white text-xs font-extrabold px-3 py-1.5 rounded-lg outline-none border border-blue-400 shadow-sm cursor-pointer">
                                <option value="adam" ${selectedChild === 'adam' ? 'selected' : ''}>👦 Adam (8 Yrs)</option>
                                <option value="maya" ${selectedChild === 'maya' ? 'selected' : ''}>👧 Maya (5 Yrs)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold">${child.name}'s LaPaQ RNI Intake</h2>
                        <p class="text-xs text-slate-300 mt-0.5">Recommended Nutrient Intake (RNI) compliance profile</p>
                    </div>
                    <div class="pt-1">
                        <a href="https://lapaq.app:3000/login" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center space-x-1.5 shadow-md transition">
                            <span>🔗 Connect / Login to LaPaQ Portal</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        </a>
                    </div>
                </div>

                <!-- Annual Health & Growth Check & Active Screening Inputs -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center">🩺 Annual Health & Growth Check</h3>
                        <span class="text-[10px] bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded-full">WHO Standards</span>
                    </div>
                    <p class="text-[10px] text-slate-500">Input height and weight to automatically analyze Stunting (HAZ), Wasting, and Overweight/Obesity (BMI).</p>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Height (cm)</label>
                            <input type="number" id="input-height" value="${child.height}" oninput="recalculateGrowthMetrics()" class="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Weight (kg)</label>
                            <input type="number" id="input-weight" value="${child.weight}" oninput="recalculateGrowthMetrics()" class="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-bold">
                        </div>
                    </div>

                    <div id="growth-evaluation-box" class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1.5 text-xs">
                        <div class="flex justify-between">
                            <span class="text-slate-500 font-semibold">Calculated BMI:</span>
                            <span id="res-bmi" class="font-bold text-slate-800">${child.bmi}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500 font-semibold">Stunting Status (HAZ):</span>
                            <span id="res-stunting" class="font-bold text-emerald-600">${child.stuntingStatus}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500 font-semibold">Wasting / Obesity (BAZ):</span>
                            <span id="res-wasting" class="font-bold text-emerald-600">${child.wastingStatus}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function recalculateGrowthMetrics() {
            const h = parseFloat(document.getElementById('input-height').value) || 100;
            const w = parseFloat(document.getElementById('input-weight').value) || 15;
            const heightInMeters = h / 100;
            const bmiValue = (w / (heightInMeters * heightInMeters)).toFixed(1);

            let stunting = "Normal Height-for-Age (No Stunting)";
            let wasting = "Normal BMI-for-Age (Optimal)";

            if (h < 110 && selectedChild === 'adam') {
                stunting = "⚠️ Moderate Stunting Risk Detected";
            }
            if (bmiValue > 18.5) {
                wasting = "⚠️ Overweight / Obesity Risk";
            } else if (bmiValue < 13.5) {
                wasting = "⚠️ Underweight / Wasting Risk";
            }

            document.getElementById('res-bmi').innerText = `${bmiValue} kg/m²`;
            document.getElementById('res-stunting').innerText = stunting;
            document.getElementById('res-wasting').innerText = wasting;

            childrenData[selectedChild].height = h;
            childrenData[selectedChild].weight = w;
            childrenData[selectedChild].bmi = `${bmiValue} kg/m²`;
            childrenData[selectedChild].stuntingStatus = stunting;
            childrenData[selectedChild].wastingStatus = wasting;
        }

        function renderTokensPage() {
            const child = childrenData[selectedChild];
            return `
                <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl p-5 text-white shadow-lg space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="bg-amber-400/40 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Impact Wallet</span>
                        <select onchange="changeTokenChild(this.value)" class="bg-amber-700 text-white text-xs font-bold px-2.5 py-1 rounded-lg outline-none border border-amber-500 cursor-pointer">
                            <option value="adam" ${selectedChild === 'adam' ? 'selected' : ''}>Adam (8 Yrs)</option>
                            <option value="maya" ${selectedChild === 'maya' ? 'selected' : ''}>Maya (5 Yrs)</option>
                        </select>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold">${child.name}'s Token Balance</h2>
                        <p class="text-xs text-amber-100 mt-0.5">Physical play, eco-habits, school attendance, and social leadership</p>
                    </div>
                </div>
            `;
        }

        function renderChildProfile(childKey) {
            const child = childrenData[childKey];
            return `
                <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-5 text-white shadow-lg space-y-3">
                    <div class="flex justify-between items-center border-b border-indigo-400/30 pb-2.5">
                        <span class="bg-indigo-400/40 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Children Profile</span>
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[10px] text-indigo-200 font-bold uppercase">Child:</span>
                            <select onchange="switchChildView(this.value)" class="bg-white text-indigo-900 text-xs font-extrabold px-3 py-1.5 rounded-lg outline-none shadow-sm cursor-pointer border border-indigo-200">
                                <option value="adam" ${childKey === 'adam' ? 'selected' : ''}>👦 Adam (8 Yrs)</option>
                                <option value="maya" ${childKey === 'maya' ? 'selected' : ''}>👧 Maya (5 Yrs)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold">${child.name}'s Passport</h2>
                        <p class="text-xs text-indigo-100">${child.age} •${child.school}</p>
                    </div>
                </div>
            `;
        }

        function changeLaPaQChild(childKey) {
            selectedChild = childKey;
            switchTab('lapaq');
        }
        function changeTokenChild(childKey) {
            selectedChild = childKey;
            switchTab('tokens');
        }
        function switchChildView(childKey) {
            selectedChild = childKey;
            switchTab('layer3');
        }

        const contentData = {
            layer1: ``, 
            home: ``, 
            layer3: ``, 
            tokens: ``, 
            lapaq: ``, 
            school: ``, 
            scanner: `
                <div class="bg-gradient-to-br from-violet-600 to-purple-700 rounded-2xl p-5 text-white shadow-lg">
                    <span class="bg-violet-500/50 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Camera Integration</span>
                    <h2 class="text-xl font-bold mt-1">QR & Badge Scanner</h2>
                    <p class="text-xs text-violet-100 mt-1">Scan physical activity or eco-habit station QR codes</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3 text-center">
                    <div id="reader" class="w-full overflow-hidden rounded-lg bg-slate-100"></div>
                    <div id="scan-result" class="p-3 bg-slate-50 rounded-lg text-xs text-slate-700 font-mono">
                        Status: Camera ready. Aim at Activity (ACT-) or Eco-Habit (ECO-) QR codes.
                    </div>
                    <button onclick="startScanner()" class="w-full bg-violet-600 text-white py-2.5 rounded-xl font-semibold text-sm shadow hover:bg-violet-700 transition">Start Camera Scanner</button>
                </div>
            `
        };

        function switchTab(tabKey) {
            if (currentUserRole === 'partner' && ['home', 'layer3', 'tokens', 'lapaq'].includes(tabKey)) {
                alert("🔒 Access Restricted: Organization Partner accounts can only view Partner Profile/Dashboard and QR Scanner.");
                return;
            }
            if (currentUserRole === 'parent' && tabKey === 'school') {
                alert("🔒 Access Restricted: Parent accounts do not have access to the Partner Organization Dashboard.");
                return;
            }

            if (html5QrCode && tabKey !== 'scanner') {
                try { html5QrCode.stop(); } catch(e){}
            }

            const titles = {
                layer1: "Registration Gateway",
                home: currentUserRole === 'partner' ? "Partner Profile Home" : "Parent Profile Home",
                layer3: "Children Profile",
                lapaq: "LaPaQ RNI Analytics",
                school: "Partner Dashboard",
                scanner: "QR Code Scanner",
                tokens: "Impact Tokens Wallet"
            };
            
            const titleElem = document.getElementById('app-title');
            if (titleElem) titleElem.innerText = titles[tabKey] || "ChildESG™ Mobile";

            const partnerLabel = document.getElementById('nav-label-partner');
            if (partnerLabel) partnerLabel.innerText = currentUserRole === 'partner' ? "Dashboard" : "Partner";
            
            const contentElem = document.getElementById('app-content');
            if (contentElem) {
                if (tabKey === 'layer1') {
                    contentElem.innerHTML = renderRegistrationPage();
                } else if (tabKey === 'home') {
                    contentElem.innerHTML = currentUserRole === 'partner' ? renderPartnerProfilePage() : renderParentProfilePage();
                } else if (tabKey === 'layer3') {
                    contentElem.innerHTML = renderChildProfile(selectedChild);
                } else if (tabKey === 'lapaq') {
                    contentElem.innerHTML = renderLaPaQPage();
                } else if (tabKey === 'tokens') {
                    contentElem.innerHTML = renderTokensPage();
                } else if (tabKey === 'school') {
                    contentElem.innerHTML = renderPartnerDashboard();
                } else {
                    contentElem.innerHTML = contentData[tabKey] || contentData['layer1'];
                }
            }
            ['layer1', 'home', 'layer3', 'lapaq', 'school', 'scanner', 'tokens'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (btn) {
                    if (key === tabKey || (currentUserRole === 'partner' && key === 'school' && tabKey === 'home')) {
                        btn.classList.remove('text-slate-400');
                        btn.classList.add('text-emerald-600');
                    } else {
                        btn.classList.remove('text-emerald-600');
                        btn.classList.add('text-slate-400');
                    }
                }
            });
        }

        function startScanner() {
            if (typeof Html5Qrcode !== 'undefined') {
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        document.getElementById('scan-result').innerText = `Scanned Success: ${decodedText}`;
                        html5QrCode.stop().catch(() => {});
                    },
                    () => {}
                ).catch(() => {
                    document.getElementById('scan-result').innerText = `Camera error or permission denied.`;
                });
            } else {
                document.getElementById('scan-result').innerText = `Scanner library loading... Please refresh.`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            switchTab('layer1');
        });
    </script>
</body>
</html>
