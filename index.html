<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChildESG™ Mobile Prototype</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code Scanner Library CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-[100dvh] p-0 overflow-hidden">
    <!-- Responsive Phone Frame Container -->
    <div class="w-full h-[100dvh] sm:max-w-[400px] sm:h-[844px] bg-slate-50 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-8 sm:border-slate-800">

        <!-- Header Shell Container -->
        <div id="header-container"></div>

        <!-- Slide-out Navigation Drawer Menu Shell -->
        <div id="drawer-container"></div>

        <!-- Main Dynamic Screen Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-24 hide-scrollbar space-y-4 relative">
            <div class="p-4 bg-white rounded-xl shadow-sm text-center">
                <p class="text-xs text-slate-500 font-bold">Loading ChildESG™ Platform...</p>
            </div>
        </main>

        <!-- Modals Shell Container -->
        <div id="modals-container"></div>

        <!-- Bottom Navigation Bar Shell -->
        <div id="bottom-nav-container"></div>
    </div>

    <!-- ES6 Application Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
