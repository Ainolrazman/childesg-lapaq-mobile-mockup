                    <h2 class="text-xl font-bold mt-1">QR & Badge Scanner</h2>
                    <p class="text-xs text-violet-100 mt-1">Scan physical activity or eco-habit station QR codes</p>
                </div>

                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3 text-center">
                    <div id="reader" class="w-full overflow-hidden rounded-lg bg-slate-100"></div>
                    <div id="scan-result" class="p-3 bg-slate-50 rounded-lg text-xs text-slate-700 font-mono">
                        Status: Camera ready. Aim at Activity (ACT-) or Eco-Habit (ECO-) QR codes.
                    </div>
                    <button onclick="startScanner()" class="w-full bg-violet-600 text-white py-2.5 rounded-xl font-semibold text-sm shadow hover:bg-violet-700 transition">Start Camera Scanner</button>
                </div>
            `,

            sroi: `
                <div class="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-2xl p-5 text-white shadow-lg">
                    <span class="bg-emerald-500/50 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Audit-Ready ESG</span>
                    <h2 class="text-xl font-bold mt-1">SROI Valuation</h2>
                    <p class="text-xs text-emerald-100 mt-1">Certified via Social Value Frameworks</p>
                </div>

                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 text-center space-y-2">
                    <p class="text-xs text-slate-400 font-bold uppercase">Social Return Ratio</p>
                    <p class="text-3xl font-extrabold text-emerald-600">~RM 6.20</p>
                    <p class="text-xs text-slate-600">Generated social value per RM 1.00 spent by corporate sponsors.</p>
                </div>
            `
        };

        function renderChildProfile(childKey) {
            const child = childrenData[childKey];
            return `
                <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-5 text-white shadow-lg space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="bg-indigo-400/40 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Children Profile</span>
                        
                        <!-- Child Selector Choice -->
                        <select onchange="switchChildView(this.value)" class="bg-white/20 text-white text-xs font-bold px-2 py-1 rounded-lg outline-none border border-white/30 cursor-pointer">
                            <option value="adam" ${childKey === 'adam' ? 'selected' : ''} class="text-slate-800">Adam (8 Yrs)</option>
                            <option value="maya" ${childKey === 'maya' ? 'selected' : ''} class="text-slate-800">Maya (5 Yrs)</option>
                        </select>
                    </div>

                    <div>
                        <h2 class="text-xl font-bold">${child.name}'s Passport</h2>
                        <p class="text-xs text-indigo-100">${child.age} • ${child.school}</p>
                    </div>

                    <div class="bg-white/10 rounded-xl p-3 flex justify-between items-center text-xs">
                        <div>
                            <p class="text-indigo-200">Hashed Student Token</p>
                            <p class="font-mono font-bold tracking-wider">${child.token}</p>
                        </div>
                        <span class="bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded font-bold">PDPA Active</span>
                    </div>
                </div>

                <!-- Child Quick Switch Cards -->
                <div class="flex space-x-2 overflow-x-auto py-1 hide-scrollbar">
                    <button onclick="switchChildView('adam')" class="flex-1 min-w-[130px] p-2.5 rounded-xl border text-left transition ${childKey === 'adam' ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-100'}">
                        <p class="text-xs font-bold text-slate-800">Adam</p>
                        <p class="text-[10px] text-slate-500">SK Petaling Jaya</p>
                    </button>
                    <button onclick="switchChildView('maya')" class="flex-1 min-w-[130px] p-2.5 rounded-xl border text-left transition ${childKey === 'maya' ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-100'}">
                        <p class="text-xs font-bold text-slate-800">Maya</p>
                        <p class="text-[10px] text-slate-500">Taska Flabee</p>
                    </button>
                </div>

                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Growth Trajectory (WHO Standards)</h3>
                        <span class="text-[10px] bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded-full">Healthy</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="p-3 bg-emerald-50 rounded-lg border border-emerald-100">
                            <p class="text-[10px] text-emerald-600 font-semibold uppercase">Height-for-Age</p>
                            <p class="text-base font-bold text-slate-800 mt-0.5">${child.height}</p>
                            <p class="text-[10px] text-emerald-700 mt-1 font-medium">HAZ: ${child.haz}</p>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-lg border border-blue-100">
                            <p class="text-[10px] text-blue-600 font-semibold uppercase">BMI-for-Age</p>
                            <p class="text-base font-bold text-slate-800 mt-0.5">${child.bmi}</p>
                            <p class="text-[10px] text-blue-700 mt-1 font-medium">BAZ: ${child.baz}</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Physical Activity & Tokens</h3>
                        <span class="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-full">${child.tokensEarned}</span>
                    </div>
                    <p class="text-xs text-slate-600">Active Play Today: <strong>${child.playTime}</strong></p>
                    <button onclick="switchTab('scanner')" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold text-xs hover:bg-indigo-700 transition">
                        📷 Scan Station QR for ${child.name}
                    </button>
                </div>
            `;
        }

        function switchChildView(childKey) {
            selectedChild = childKey;
            switchTab('layer3');
        }

        function switchTab(tabKey) {
            if (html5QrCode && tabKey !== 'scanner') {
                html5QrCode.stop().catch(() => {});
            }

            const titles = {
                layer1: "Legal Registration",
                layer2: "Home",
                layer3: "Children Profile",
                lapaq: "LaPaQ RNI Analytics",
                school: "School Dashboard",
                scanner: "QR Code Scanner",
                sroi: "SROI Dashboard"
            };
            document.getElementById('app-title').innerText = titles[tabKey];
            
            if (tabKey === 'layer3') {
                document.getElementById('app-content').innerHTML = renderChildProfile(selectedChild);
            } else {
                document.getElementById('app-content').innerHTML = contentData[tabKey];
            }

            ['layer2', 'layer3', 'lapaq', 'school', 'scanner', 'sroi'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (btn) {
                    if (key === tabKey) {
                        btn.classList.remove('text-slate-400');
                        btn.classList.add('text-emerald-600');
                    } else {
                        btn.classList.remove('text-emerald-600');
                        btn.classList.add('text-slate-400');
                    }
                }
            });
        }

        function selectTimeSpan(span) {
            ['1', '7', '30', '90', '365', 'custom'].forEach(s => {
                const btn = document.getElementById(`ts-${s}`);
                if (btn) {
                    if (s === span) {
                        btn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-blue-600 text-white transition";
                    } else {
                        btn.className = "py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition";
                    }
                }
            });

            const customPicker = document.getElementById('custom-date-picker');
            if (span === 'custom') {
                customPicker.classList.remove('hidden');
            } else {
                customPicker.classList.add('hidden');
            }
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    document.getElementById('scan-result').innerText = `Scanned Success: ${decodedText}`;
                    html5QrCode.stop().catch(() => {});
                },
                () => {}
            ).catch(() => {
                document.getElementById('scan-result').innerText = `Camera error or permission denied.`;
            });
        }

        // Initialize default view to Home (Layer 2)
        switchTab('layer2');
    </script>
</body>
</html>
