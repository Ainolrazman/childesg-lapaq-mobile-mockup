<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChildESG x LaPaQ x Flabee Mobile Prototype</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code Scanner Library CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Device Frame Container -->
    <div class="w-full sm:max-w-[400px] h-screen sm:h-[844px] bg-slate-50 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-8 sm:border-slate-800">
        
        <!-- Top Status Bar Mock -->
        <div class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center text-xs font-semibold shrink-0">
            <span>10:34</span>
            <div class="w-20 h-4 bg-slate-800 rounded-full mx-auto absolute left-1/2 transform -translate-x-1/2 hidden sm:block"></div>
            <div class="flex space-x-1.5 items-center">
                <span>5G</span>
                <div class="w-5 h-2.5 border border-white rounded-sm p-0.5 flex items-center">
                    <div class="w-full h-full bg-white rounded-2xs"></div>
                </div>
            </div>
        </div>

        <!-- App Header -->
        <header class="bg-white border-b border-slate-200 px-5 py-3.5 flex justify-between items-center shrink-0">
            <div>
                <span class="text-[10px] font-bold tracking-wider text-blue-600 uppercase">Kemaih Ecosystem</span>
                <h1 id="app-title" class="text-lg font-bold text-slate-900">Parent Onboarding</h1>
            </div>
            <button onclick="switchTab('register')" class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-xs hover:bg-blue-200 transition">
                Auth
            </button>
        </header>

        <!-- Main Scrollable Screen Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto p-5 pb-24 hide-scrollbar space-y-5">
            <!-- Dynamic Content Injected via JavaScript -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-1 py-2 flex justify-around items-center shrink-0 z-50">
            <button onclick="switchTab('register')" id="nav-register" class="flex flex-col items-center py-1 px-1 text-blue-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-[8px] font-medium">Layer 1</span>
            </button>
            <button onclick="switchTab('child_mgmt')" id="nav-child_mgmt" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span class="text-[8px] font-medium">Layer 2</span>
            </button>
            <button onclick="switchTab('school')" id="nav-school" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span class="text-[8px] font-medium">School</span>
            </button>
            <button onclick="switchTab('passport')" id="nav-passport" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span class="text-[8px] font-medium">Passport</span>
            </button>
            <button onclick="switchTab('flabee')" id="nav-flabee" class="flex flex-col items-center py-1 px-1 text-slate-400 hover:text-slate-600 transition-all">
                <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                <span class="text-[8px] font-medium">
