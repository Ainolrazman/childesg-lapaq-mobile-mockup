                            <div>
                                <label class="block text-[9px] text-slate-400 font-bold uppercase mb-0.5">To Date</label>
                                <input type="date" value="2026-10-18" class="w-full text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-slate-700">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">9 RNI Intake Bars Compliance</h3>
                        <span class="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-full">Span: ${rniTimeSpan === 'custom' ? 'Custom Range' : rniTimeSpan + ' Day(s)'}</span>
                    </div>
                    <div class="space-y-3">
                        ${rniMetrics.map(m => {
                            const pct = Math.min(Math.round((m.current / m.target) * 100), 100);
                            return `
                                <div class="space-y-1">
                                    <div class="flex justify-between text-xs font-semibold">
                                        <span class="text-slate-700">${m.name}</span>
                                        <span class="text-slate-800">${m.current.toLocaleString()} / ${m.target.toLocaleString()} ${m.unit} <span class="text-emerald-600 font-bold">(${pct}%)</span></span>
                                    </div>
                                    <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                        <div class="${m.color} h-full" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function selectRniTimeSpan(span) { rniTimeSpan = span; switchTab('lapaq'); }

        function recalculateGrowthMetrics() {
            const h = parseFloat(document.getElementById('input-height').value) || 100;
            const w = parseFloat(document.getElementById('input-weight').value) || 15;
            const bmiValue = (w / ((h/100) * (h/100))).toFixed(1);
            document.getElementById('res-bmi').innerText = `${bmiValue} kg/m²`;
            childrenData[selectedChild].height = h;
            childrenData[selectedChild].weight = w;
            childrenData[selectedChild].bmi = `${bmiValue} kg/m²`;
        }

        function claimRNIToken() {
            const child = childrenData[selectedChild];
            child.rniClaimed = true;
            child.nutritionTokens += 10;
            child.totalTokens += 10;
            alert(`🎉 Daily RNI Balanced Diet Target Met! 10 Nutrition Tokens minted to ${child.name}'s wallet.`);
            switchTab('lapaq');
        }

        function renderTokensPage() {
            const child = childrenData[selectedChild];
            return `
                <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl p-5 text-white shadow-lg space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="bg-amber-400/40 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Impact Wallet Dashboard</span>
                        <select onchange="changeTokenChild(this.value)" class="bg-amber-700 text-white text-xs font-bold px-2.5 py-1 rounded-lg outline-none cursor-pointer">
                            <option value="adam" ${selectedChild === 'adam' ? 'selected' : ''}>Adam (8 Yrs)</option>
                            <option value="maya" ${selectedChild === 'maya' ? 'selected' : ''}>Maya (5 Yrs)</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold">${child.name}'s Token Balance</h2>
                            <p class="text-xs text-amber-100 mt-0.5">Verified via Partner QR, LaPaQ Intelligence & Organizer Rating</p>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-extrabold text-white">${child.totalTokens}</span>
                            <p class="text-[9px] text-amber-200 uppercase font-bold">Total Tokens</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">🎁 Token Reward Exchange System</h3>
                        <span class="text-[10px] bg-amber-50 text-amber-700 font-bold px-2 py-0.5 rounded-full">Redeemable</span>
                    </div>
                    <div class="space-y-2">
                        <div class="p-3 bg-slate-50 rounded-lg flex justify-between items-center border border-slate-100">
                            <div><p class="text-xs font-bold text-slate-800">💻 Apple MacBook Air (M2)</p><p class="text-[10px] text-indigo-600 font-semibold">Cost: 100,000 Tokens</p></div>
                            <button onclick="redeemReward('Apple MacBook Air', 100000)" class="text-[10px] bg-slate-800 text-white px-3 py-1.5 rounded-lg font-bold">Exchange</button>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg flex justify-between items-center border border-slate-100">
                            <div><p class="text-xs font-bold text-slate-800">🥛 Pint of Milk at Jaya Grocer</p><p class="text-[10px] text-emerald-600 font-semibold">Cost: 50 Tokens</p></div>
                            <button onclick="redeemReward('Pint of Milk at Jaya Grocer', 50)" class="text-[10px] bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold">Exchange</button>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg flex justify-between items-center border border-slate-100">
                            <div><p class="text-xs font-bold text-slate-800">🏷️ 5% Rebate Voucher at Shopee</p><p class="text-[10px] text-orange-600 font-semibold">Cost: 10 Tokens</p></div>
                            <button onclick="redeemReward('5% Rebate Voucher at Shopee', 10)" class="text-[10px] bg-orange-600 text-white px-3 py-1.5 rounded-lg font-bold">Exchange</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function redeemReward(rewardName, tokenCost) {
            const child = childrenData[selectedChild];
            if (child.totalTokens >= tokenCost) {
                child.totalTokens -= tokenCost;
                alert(`🎉 Successfully Redeemed: [${rewardName}]!\n${tokenCost} tokens deducted from${child.name}'s wallet balance.`);
                switchTab('tokens');
            } else {
                alert(`❌ Insufficient Tokens!\n${child.name} has ${child.totalTokens} tokens, but requires${tokenCost} tokens for this reward.`);
            }
        }

        function changeLaPaQChild(childKey) { selectedChild = childKey; switchTab('lapaq'); }
        function changeTokenChild(childKey) { selectedChild = childKey; switchTab('tokens'); }
        function switchChildView(childKey) { selectedChild = childKey; switchTab('layer3'); }

        const contentData = { layer1: ``, home: ``, layer3: ``, tokens: ``, lapaq: ``, school: ``, 
            scanner: `
                <div class="bg-gradient-to-br from-violet-600 to-purple-700 rounded-2xl p-5 text-white shadow-lg">
                    <span class="bg-violet-500/50 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Camera Integration</span>
                    <h2 class="text-xl font-bold mt-1">QR & Badge Scanner</h2>
                    <p class="text-xs text-violet-100 mt-1">Scan physical activity or eco-habit station QR codes</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3 text-center">
                    <div id="reader" class="w-full overflow-hidden rounded-lg bg-slate-100 min-h-[200px]"></div>
                    <div id="scan-result" class="p-3 bg-slate-50 rounded-lg text-xs text-slate-700 font-mono">
                        Status: Camera ready. Aim at Partner Organization station QR code.
                    </div>
                    <button onclick="startScanner()" class="w-full bg-violet-600 text-white py-2.5 rounded-xl font-semibold text-sm shadow hover:bg-violet-700 transition">Start Camera Scanner</button>
                    <button onclick="simulateSuccessfulScan()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs shadow transition">⚡ Simulate Successful Scan (Test Mode)</button>
                </div>
            `
        };

        function switchTab(tabKey) {
            if (currentUserRole === 'partner' && ['layer3', 'tokens', 'lapaq'].includes(tabKey)) {
                alert("🔒 Access Restricted: Organization Partner accounts can only view Partner Profile Home, Partner Dashboard, and QR Scanner.");
                return;
            }
            if (currentUserRole === 'parent' && tabKey === 'school') {
                alert("🔒 Access Restricted: Parent accounts do not have access to the Partner Organization Dashboard.");
                return;
            }

            if (html5QrCode && tabKey !== 'scanner') { try { html5QrCode.stop(); } catch(e){} }

            const titles = {
                layer1: "Registration Gateway",
                home: currentUserRole === 'partner' ? "Partner Organization Profile" : "Parents Guardian Profile",
                layer3: "Children Profile",
                lapaq: "LaPaQ RNI Analytics",
                school: "Partner Dashboard",
                scanner: "QR Code Scanner",
                tokens: "Impact Tokens Wallet"
            };
            document.getElementById('app-title').innerText = titles[tabKey] || "ChildESG™ Mobile";
            const partnerLabel = document.getElementById('nav-label-partner');
            if (partnerLabel) partnerLabel.innerText = currentUserRole === 'partner' ? "Dashboard" : "Partner";
            
            const content = document.getElementById('app-content');
            if (tabKey === 'layer1') content.innerHTML = renderRegistrationPage();
            else if (tabKey === 'home') content.innerHTML = currentUserRole === 'partner' ? renderPartnerProfilePage() : renderParentProfilePage();
            else if (tabKey === 'layer3') content.innerHTML = renderChildProfile(selectedChild);
            else if (tabKey === 'lapaq') content.innerHTML = renderLaPaQPage();
            else if (tabKey === 'school') content.innerHTML = renderPartnerDashboard();
            else if (tabKey === 'tokens') content.innerHTML = renderTokensPage();
            else content.innerHTML = contentData[tabKey];

            ['layer1', 'home', 'layer3', 'lapaq', 'school', 'scanner', 'tokens'].forEach(k => {
                const btn = document.getElementById(`nav-${k}`);
                if (btn) {
                    if (k === tabKey || (currentUserRole === 'partner' && k === 'school' && tabKey === 'home')) {
                        btn.classList.remove('text-slate-400'); btn.classList.add('text-emerald-600');
                    } else {
                        btn.classList.remove('text-emerald-600'); btn.classList.add('text-slate-400');
                    }
                }
            });
        }

        function startScanner() {
            if (typeof Html5Qrcode !== 'undefined') {
                if (html5QrCode) {
                    try { html5QrCode.stop().catch(() => {}); } catch(e){}
                }
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        const child = childrenData[selectedChild];
                        child.totalTokens += 20;
                        child.impactTokens += 20;
                        document.getElementById('scan-result').innerText = `Success! Partner QR Scanned: ${decodedText}. +20 Tokens Minted!`;
                        html5QrCode.stop().catch(() => {});
                    },
                    (errorMessage) => {
                        // scanning in progress frame error ignore
                    }
                ).catch((err) => { 
                    document.getElementById('scan-result').innerText = `Camera error or permission denied: Please use Localhost or HTTPS.`; 
                });
            } else {
                document.getElementById('scan-result').innerText = `Scanner library loading... Please refresh.`;
            }
        }

        function simulateSuccessfulScan() {
            const child = childrenData[selectedChild];
            child.totalTokens += 20;
            child.impactTokens += 20;
            document.getElementById('scan-result').innerText = `Success! Simulated Partner QR Scanned: STATION-KEMAIH-01. +20 Tokens Minted to ${child.name}!`;
        }

        window.addEventListener('DOMContentLoaded', () => { switchTab('layer1'); });
    </script>
</body>
</html>
