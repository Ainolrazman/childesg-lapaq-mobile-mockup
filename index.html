function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escJs(s) {
  return String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r');
}
function getTodayDateString() {
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysFromNow(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getMaxCalendarDateString() {
  const d = new Date();
  d.setFullYear(d.getFullYear() + 1);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

      toggleRegisterFields(roleSel ? roleSel.value : currentUserRole);

function renderStarRatingSvg(rating, scoreText) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    const fillClass = i <= rating ? 'text-amber-400 fill-amber-400' : 'text-slate-300 fill-slate-200';
    html += `<svg class="w-3.5 h-3.5 ${fillClass}" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
  }
  return `<div class="flex items-center space-x-1.5 bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg"><div class="flex space-x-0.5">${html}</div><span class="text-[11px] font-black text-amber-800 ml-0.5">${esc(scoreText)}</span></div>`;
}

function renderSdgBadges(sdgIds) {
  const map = {
    2:{code:"SDG 2",title:"Zero Hunger",color:"bg-amber-100 text-amber-800 border-amber-300"},
    3:{code:"SDG 3",title:"Good Health & Well-being",color:"bg-emerald-100 text-emerald-800 border-emerald-300"},
    4:{code:"SDG 4",title:"Quality Education",color:"bg-red-100 text-red-800 border-red-300"},
    10:{code:"SDG 10",title:"Reduced Inequalities",color:"bg-pink-100 text-pink-800 border-pink-300"},
    12:{code:"SDG 12",title:"Responsible Consumption",color:"bg-yellow-100 text-yellow-800 border-yellow-300"},
    13:{code:"SDG 13",title:"Climate Action",color:"bg-green-100 text-green-800 border-green-300"},
    15:{code:"SDG 15",title:"Life on Land",color:"bg-lime-100 text-lime-800 border-lime-300"},
    17:{code:"SDG 17",title:"Partnerships for the Goals",color:"bg-blue-100 text-blue-800 border-blue-300"}
  };
  return sdgIds.map(id => {
    const s = map[id] || { code: `SDG ${id}`, title: `SDG ${id}`, color: "bg-slate-100 text-slate-800 border-slate-300" };
    return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[9px] font-extrabold border ${s.color}" title="${esc(s.title)}">🌍 ${esc(s.code)}</span>`;

function handleApplyClick(btn) {

function toggleMarketCustomCategoryInput(val) {
  const wrapper = document.getElementById('market-custom-category-wrapper');
  if (!wrapper) return;
  wrapper.classList.toggle('hidden', val !== 'Others - Please add');
}

function checkProgramDescriptionWordCount() {
  const descInput = document.getElementById('market-prog-desc');
  const indicator = document.getElementById('word-count-indicator');
  if (!descInput || !indicator) return;
  const count = descInput.value.trim() === '' ? 0 : descInput.value.trim().split(/\s+/).length;
  indicator.innerText = `${count} / 150 words`;
  indicator.className = count > 150 ? "text-[9px] font-bold text-red-600" : "text-[9px] font-bold text-slate-400";
}

function handleMarketplaceAddProgram() {
  const isBm = currentLang === 'bm';
  const catSelect = document.getElementById('market-prog-category').value;
  let finalCategory = catSelect;
  if (catSelect === 'Others - Please add') {
    const custom = document.getElementById('market-prog-custom-cat').value.trim();
    if (!custom) { alert(isBm ? "Sila masukkan nama kategori lain." : "Please specify the custom category."); return; }
    finalCategory = custom;
  }
  const progName = document.getElementById('market-prog-name').value.trim();
  const progDesc = document.getElementById('market-prog-desc').value.trim();
  const startDate = document.getElementById('market-prog-start').value;
  const endDate = document.getElementById('market-prog-end').value;
  if (!progName) { alert(isBm ? "Sila masukkan nama program." : "Please enter the name of the program."); return; }
  if (!progDesc) { alert(isBm ? "Sila masukkan penerangan." : "Please enter the description."); return; }
  const wordCount = progDesc.split(/\s+/).length;
  if (wordCount > 150) { alert(isBm ? `Melebihi 150 kata (${wordCount}).` : `Exceeds 150-word limit (${wordCount}).`); return; }
  if (endDate < startDate) { alert(isBm ? "Tarikh tamat tidak boleh sebelum tarikh mula." : "End date cannot be earlier than start date."); return; }

  featuredProgramsList.unshift({
    org: userProfiles.partner.orgName, rating: 5, ratingScore: "5.0", sdgs: [2,3,4],
    title: progName, category: finalCategory, desc: progDesc,
    slots: "30 Available", reward: "150 Impact Tokens", badge: "🌱 New Partner Event",
    startDate, endDate
  });
  if (!organizationCoursesMap[userProfiles.partner.orgName]) organizationCoursesMap[userProfiles.partner.orgName] = [];
  organizationCoursesMap[userProfiles.partner.orgName].push(progName);
  alert(isBm ? `✅ Berjaya Diterbitkan! Program "${progName}" telah ditambah.` : `✅ Published Successfully! Program "${progName}" has been added.`);
  switchTab('programs');
}

/* FIX 5 + FIX 8: dynamic child dropdown, robust modal open */
function openProgramChildSelector(courseName, orgName) {
  pendingMarketplaceProgram = { courseName, orgName };
  const isBm = currentLang === 'bm';
  const sel = document.getElementById('modal-child-select');
  if (sel) {
    sel.innerHTML = Object.entries(childrenData).map(([k, c]) =>
      `<option value="${escJs(k)}">${esc(c.name)} (${esc(c.age)} - ${esc(c.school)})</option>`).join('');
  }
  document.getElementById('prog-modal-title').innerText = isBm ? 'Pilih Kanak-kanak untuk Program' : 'Select Child for Program';
  document.getElementById('prog-modal-subtitle').innerText = `"${courseName}" (${orgName})`;
  document.getElementById('program-child-modal').classList.remove('hidden');
}

function closeProgramChildModal() {
  document.getElementById('program-child-modal').classList.add('hidden');
  pendingMarketplaceProgram = null;
}

function confirmProgramApplication() {
  if (!pendingMarketplaceProgram) return;
  const chosenChildKey = document.getElementById('modal-child-select').value;
  const { courseName, orgName } = pendingMarketplaceProgram;
  closeProgramChildModal();
  const isBm = currentLang === 'bm';
  const child = childrenData[chosenChildKey];
  if (!child) return;
  if (!child.appliedCourses) child.appliedCourses = [];
  if (child.appliedCourses.some(ac => ac.name === courseName)) {
    showModalOverlay(isBm ? "Notis" : "Notice", `${child.name} ${isBm ? 'telah pun memohon untuk' : 'has already applied for'} "${courseName}".`);
    return;
  }
  child.appliedCourses.push({ name: courseName, org: orgName, status: isBm ? "Menunggu Kelulusan" : "Pending Approval" });
  pendingApplications.push({
    childKey: chosenChildKey,
    childName: `${child.name} (${child.token})`,
    courseName: `${courseName} (${orgName})`,
    parentName: userProfiles.parent.name,
    contact: `${userProfiles.parent.phone} / ${userProfiles.parent.email}`,
    parentEmail: userProfiles.parent.email
  });
  showModalOverlay(
    isBm ? "Permohonan Diterima" : "Application Received",
    isBm
      ? `Terima kasih kerana memohon "${courseName}" untuk ${child.name}.\n\nBorang pendaftaran akan dihantar ke E-mel anda (${userProfiles.parent.email}).`
      : `Thank you for applying for "${courseName}" on behalf of ${child.name}.\n\nA registration form will be sent to your Email (${userProfiles.parent.email}), please fill in the form and email back to us.`
  );
}

function openPaymentGateway(tierTitle, amountDue) {
  document.getElementById('pay-modal-title').innerText = "Secure Payment Gateway";

  document.getElementById('pay-org-name').innerText = userProfiles.partner.orgName;

}
function closePaymentModal() { document.getElementById('payment-gateway-modal').classList.add('hidden'); }
function confirmPaymentSuccess() {
  closePaymentModal();
  alert("✅ Payment Successful via FPX Online Banking!\nYour certification tier has been successfully updated and your audit trail has been submitted for review.");
}

/* FIX 1: approve correctly-matched course */
function approveApplication(index) {
  const app = pendingApplications[index];
  if (!app) return;
  const childObj = childrenData[app.childKey];
  if (childObj && childObj.appliedCourses) {
    const targetApp = childObj.appliedCourses.find(ac => app.courseName.includes(ac.name));
    if (targetApp) targetApp.status = "Approved";
  }
  alert(currentLang === 'bm'
    ? `✅ Permohonan Diluluskan!\n${app.childName} telah diluluskan untuk "${app.courseName}".`
    : `✅ Application Approved!\n${app.childName} has been successfully approved for "${app.courseName}".`);
  pendingApplications.splice(index, 1);
  switchTab('school');
}

function sendFormToRecipient(index) {
  const app = pendingApplications[index];
  if (!app) return;
  const emailAddr = app.parentEmail || userProfiles.parent.email;
  currentUserRole = 'parent';
  switchTab('home');
  showModalOverlay(
    currentLang === 'bm' ? "Permohonan Diterima" : "Application Received",
    currentLang === 'bm'
      ? `Terima kasih kerana memohon kursus / aktiviti.\n\nBorang pendaftaran akan dihantar ke E-mel (${emailAddr}), sila isi dan e-mel kembali kepada kami.`
      : `Thank you for applying for the course / activity.\n\nA registration form will be sent to your Email (${emailAddr}), please fill in the form and email back to us.`
  );
}

/* FIX 3: only award tokens to a real registered child */
function rateCommunityToken(studentName) {
  const isBm = currentLang === 'bm';
  const group = participantGroups[activeParticipantGroup];
  if (!group) return;
  const participant = group.find(p => p.name === studentName);
  if (!participant) return;
  const rating = prompt(isBm ? `Penilaian Penganjur untuk ${studentName} (1-5 Bintang):` : `Organizer / Peer Rating for ${studentName} (1 to 5 Stars):`, "5");
  if (rating === null) return;
  const parsed = parseInt(rating, 10);
  if (isNaN(parsed) || parsed < 1 || parsed > 5) {
    alert(isBm ? "❌ Sila masukkan nombor sah antara 1 dan 5." : "❌ Please enter a valid number between 1 and 5.");
    return;
  }
  participant.stars = parsed;
  if (participant.childKey && childrenData[participant.childKey]) {
    const child = childrenData[participant.childKey];
    child.communityTokens += parsed * 10;
    child.totalTokens += parsed * 10;
    alert(isBm
      ? `🤝 Penilaian Komuniti & Kepimpinan Disimpan! Dianugerahkan ${parsed} bintang (${parsed * 10} token) kepada ${studentName}.`
      : `🤝 Community & Leadership Rating Saved! Awarded ${parsed} stars (${parsed * 10} tokens) to ${studentName}.`);
  } else {
    alert(isBm
      ? `📝 Penilaian ${studentName} disimpan (peserta bukan dalam akaun anda, token tidak dianugerahkan).`
      : `📝 Rating for ${studentName} saved (participant is not linked to a registered child; tokens not awarded).`);
  }
  switchTab('school');
}

function submitNewCourseApplication() {
  const orgSelect = document.getElementById('apply-org-select');
  const courseSelect = document.getElementById('apply-course-select');
  const isBm = currentLang === 'bm';
  if (!orgSelect || !courseSelect) return;
  const org = orgSelect.value;
  const courseName = courseSelect.value;
  const child = childrenData[selectedChild];
  if (!child) return;
  if (!child.appliedCourses) child.appliedCourses = [];
  if (child.appliedCourses.some(ac => ac.name === courseName)) {
    showModalOverlay(isBm ? "Notis" : "Notice", `${child.name} ${isBm ? 'telah pun memohon untuk' : 'has already applied for'} "${courseName}".`);
    return;
  }
  child.appliedCourses.push({ name: courseName, org, status: isBm ? "Menunggu Kelulusan" : "Pending Approval" });
  pendingApplications.push({
    childKey: selectedChild,
    childName: `${child.name} (${child.token})`,
    courseName: `${courseName} (${org})`,
    parentName: userProfiles.parent.name,
    contact: `${userProfiles.parent.phone} / ${userProfiles.parent.email}`,
    parentEmail: userProfiles.parent.email
  });
  showModalOverlay(
    isBm ? "Permohonan Diterima" : "Application Received",
    isBm
      ? `Terima kasih kerana memohon kursus / aktiviti untuk ${child.name}.\n\nBorang pendaftaran akan dihantar ke E-mel anda (${userProfiles.parent.email}).`
      : `Thank you for applying for the course / activity on behalf of ${child.name}.\n\nA registration form will be sent to your Email (${userProfiles.parent.email}), please fill in the form and email back to us.`
  );
}

function recalculateGrowthMetrics() {
  const h = parseFloat(document.getElementById('input-height').value) || 100;
  const w = parseFloat(document.getElementById('input-weight').value) || 15;
  const bmi = (w / ((h/100) * (h/100))).toFixed(1);
  document.getElementById('res-bmi').innerText = `${bmi} kg/m²`;
  if (childrenData[selectedChild]) {
    childrenData[selectedChild].height = h;
    childrenData[selectedChild].weight = w;
    childrenData[selectedChild].bmi = `${bmi} kg/m²`;
  }
}

function claimRNIToken() {

    alert(isBm
      ? `🎉 Berjaya Ditukar: [${rewardName}]!\n${tokenCost} token ditolak daripada dompet ${child.name}.`

      : `❌ Insufficient Tokens!\n${child.name} has ${child.totalTokens} tokens, but requires ${tokenCost} tokens for this reward.`);

function sdgStatusLabel(status, isBm) {
  if (status === 'verified') return isBm ? 'Disahkan (demo)' : 'Verified (demo)';
  if (status === 'rejected') return isBm ? 'Ditolak' : 'Rejected';
  return isBm ? 'Menunggu semakan' : 'Pending review';
}

  }).join('') : `<div class="p-5 text-center bg-white border border-dashed border-slate-300 rounded-xl text-xs text-slate-500">${isBm ? 'Tiada rekod untuk penapis ini.' : 'No records match these filters.'}</div>`;

    <div class="grid grid-cols-2 gap-2">${sdgCards}</div>
  </section>
  <section class="bg-white rounded-xl border border-slate-200 p-3 space-y-3">
    <div><h3 class="text-sm font-extrabold text-slate-900">${isBm ? 'Penapis & rekod bukti' : 'Filters & evidence records'}</h3><p class="text-[10px] text-slate-500 mt-1">${isBm ? 'Pilih anak untuk melihat rekod berkaitan.' : 'Choose a child to view related records.'}</p></div>
    <select onchange="setSdgChildFilter(this.value)" class="w-full p-2.5 border border-slate-200 bg-slate-50 rounded-lg text-xs font-bold"><option value="all" ${sdgSelectedChild === 'all' ? 'selected' : ''}>${isBm ? 'Semua anak' : 'All children'}</option>${childOptions}</select>

    <label class="block text-[10px] font-bold text-slate-600">${isBm ? 'SDG utama' : 'Primary SDG'}<select id="sdg-new-goal" class="mt-1 w-full p-2.5 rounded-lg border border-slate-200 bg-slate-50 text-xs">${sdgCatalog.map(x => `<option value="${x.id}">SDG ${x.id} — ${esc(isBm ? x.bm : x.name)}</option>`).join('')}</select></label>
    <label class="block text-[10px] font-bold text-slate-600">${isBm ? 'Bukti / rujukan' : 'Evidence / reference'}<input id="sdg-new-evidence" maxlength="160" class="mt-1 w-full p-2.5 rounded-lg border border-slate-200 text-xs" placeholder="Photo reference, activity certificate..."></label>

function setSdgFilter(value) { sdgSelectedFilter = value; switchTab('sdg'); }
function setSdgChildFilter(value) { sdgSelectedChild = value; switchTab('sdg'); }

/* FIX 8: local date, not UTC */
function addSdgRecord() {
  const isBm = currentLang === 'bm';
  const title = document.getElementById('sdg-new-title')?.value.trim();
  const evidence = document.getElementById('sdg-new-evidence')?.value.trim();
  const childKey = document.getElementById('sdg-new-child')?.value;
  const goal = Number(document.getElementById('sdg-new-goal')?.value);
  if (!title || !evidence) {
    alert(isBm ? 'Sila masukkan nama aktiviti dan rujukan bukti.' : 'Please enter an activity name and evidence reference.');
    return;
  }
  sdgEvidenceRecords.unshift({
    id: 'DEMO-' + Date.now().toString().slice(-8),
    child: childKey, title, sdgs: [goal], category: 'community',
    date: getTodayDateString(),
    measure: 'Activity recorded', value: 1, unit: 'record',
    evidence, status: 'pending',
    note: 'Demo record only. Evidence has not been independently verified.'
  });
  sdgSelectedFilter = 'all';
  sdgSelectedChild = 'all';
  switchTab('sdg');
}

/* FIX 2: no crash on missing record */
function reviewSdgRecord(id) {
  const record = sdgEvidenceRecords.find(r => r.id === id);
  if (!record) return;
  if (record.status === 'verified') return;
  record.status = 'verified';
  record.note = 'Verified by Kemaih Sdn Bhd partner audit team.';
  alert(currentLang === 'bm' ? '✅ Rekod impak SDG berjaya disahkan!' : '✅ SDG Impact record successfully verified!');
  switchTab('sdg');
}

  scanner: `

  </div>`
};

/* =========================================================
   Tab router (FIX 11: resets partner view on leaving school)
   ========================================================= */
function switchTab(tabKey) {
  if (currentUserRole === 'partner' && ['layer3','tokens','lapaq'].includes(tabKey)) {
    alert(currentLang === 'bm' ? "🔒 Akses Terhad: Akaun Rakan Kongsi hanya boleh melihat Profil, Pemuka Rakan Kongsi, dan Pengimbas QR." : "🔒 Access Restricted: Organization Partner accounts can only view Partner Profile Home, Partner Dashboard, and QR Scanner.");
    return;
  }
  if (currentUserRole === 'parent' && tabKey === 'school') {
    alert(currentLang === 'bm' ? "🔒 Akses Terhad: Akaun Ibu Bapa tidak mempunyai akses ke Pemuka Rakan Kongsi." : "🔒 Access Restricted: Parent accounts do not have access to the Partner Organization Dashboard.");
    return;
  }

  // Reset partner view when leaving the school tab (fixes stuck group_detail)
  if (activeTabKey === 'school' && tabKey !== 'school') {
    currentPartnerView = 'dashboard';
    activeParticipantGroup = '';
  }

  if (html5QrCode && tabKey !== 'scanner') {
    try { html5QrCode.stop(); } catch (e) {}
  }

  activeTabKey = tabKey;
  document.getElementById('app-title').innerText = i18n[currentLang].titles[tabKey] || "ChildESG™ Mobile";
  const content = document.getElementById('app-content');

  if (tabKey === 'layer1') {
    content.innerHTML = renderRegistrationPage();
    setTimeout(() => toggleRegisterFields(currentUserRole), 50);
  } else if (tabKey === 'home') {
    content.innerHTML = currentUserRole === 'partner' ? renderPartnerProfilePage() : renderParentProfilePage();
  } else if (tabKey === 'programs') {
    content.innerHTML = renderProgramsPage();
  } else if (tabKey === 'layer3') {
    content.innerHTML = renderChildProfile(selectedChild);
    setTimeout(() => {
      const orgSel = document.getElementById('apply-org-select');
      if (orgSel) updateCourseDropdown(orgSel.value);
    }, 50);
  } else if (tabKey === 'lapaq') {
    content.innerHTML = renderLaPaQPage();
  } else if (tabKey === 'sdg') {
    content.innerHTML = currentUserRole === 'partner' ? renderPartnerSdgPassport() : renderParentSdgPassport();
  } else if (tabKey === 'school') {
    content.innerHTML = renderPartnerDashboard();
  } else if (tabKey === 'tokens') {
    content.innerHTML = renderTokensPage();
  } else {
    content.innerHTML = contentData[tabKey];
  }

  ['layer1','home'].forEach(k => {
    const btn = document.getElementById(`nav-${k}`);
    if (btn) {
      if (k === tabKey) { btn.classList.remove('text-slate-400'); btn.classList.add('text-emerald-600'); }
      else { btn.classList.remove('text-emerald-600'); btn.classList.add('text-slate-400'); }
    }
  });
}

/* =========================================================
   QR scanner (single definition — FIX 4)
   ========================================================= */
function startScanner() {
  if (typeof Html5Qrcode === 'undefined') {
    document.getElementById('scan-result').innerText = 'Scanner library loading... Please refresh.';
    return;
  }
  if (html5QrCode) { try { html5QrCode.stop().catch(() => {}); } catch (e) {} }
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      const child = childrenData[selectedChild];
      if (child) {
        child.totalTokens += 25;
        child.impactTokens += 25;
      }
      document.getElementById('scan-result').innerText = `Success! Partner QR Scanned: ${decodedText}. +25 Tokens Minted!`;
      html5QrCode.stop().catch(() => {});
    },
    () => {}
  ).catch(() => {
    document.getElementById('scan-result').innerText = `Camera error or permission denied: Please use Localhost or HTTPS.`;
  });
}

/* FIX 12: demo-only, clearly labeled, guarded */
function simulateSuccessfulScan() {
  if (!isDemoMode()) {
    alert('Simulate scan is only available in demo mode. Add ?demo=1 to the URL.');
    return;
  }
  const child = childrenData[selectedChild];
  if (!child) return;
  child.totalTokens += 25;
  child.impactTokens += 25;
  document.getElementById('scan-result').innerText = `Success! Simulated Partner QR Scanned: STATION-KEMAIH-01. +25 Tokens Minted to ${child.name}!`;
}
