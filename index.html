        function switchTab(tabKey) {
            if (html5QrCode && tabKey !== 'scanner') {
                html5QrCode.stop().catch(() => {});
            }

            const titles = {
                register: "Parent Onboarding (Layer 1)",
                child_mgmt: "Child Management (Layer 2)",
                school: "School Portal",
                passport: "ChildESG Passport",
                flabee: "Flabee Care",
                lapaq: "LaPaQ Intelligence",
                scanner: "Barcode Scanner",
                sroi: "SROI & ESG Dashboard"
            };
            document.getElementById('app-title').innerText = titles[tabKey];
            document.getElementById('app-content').innerHTML = contentData[tabKey];

            ['register', 'child_mgmt', 'school', 'passport', 'flabee', 'lapaq', 'scanner', 'sroi'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (key === tabKey) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-blue-600');
                } else {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-400');
                }
            });
        }

        function registerParentDemo() {
            alert("Layer 1 Guardian Account registered successfully! Proceeding to Layer 2 Child Management...");
            switchTab('child_mgmt');
        }

        function linkChildDemo() {
            alert("Child profile & health record successfully registered! Tokenized Passport generated: #AB-34X-KEMAIH");
            switchTab('passport');
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText, decodedResult) => {
                    document.getElementById('scan-result').innerText = `Scanned Success: ${decodedText}`;
                    html5QrCode.stop();
                },
                (errorMessage) => {}
            ).catch(err => {
                document.getElementById('scan-result').innerText = `Camera error or permission denied.`;
            });
        }

        // Initialize default tab on load
        switchTab('register');
    </script>
