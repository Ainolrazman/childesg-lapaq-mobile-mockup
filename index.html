<body class="bg-slate-900 flex items-center justify-center min-h-screen p-0 sm:p-4">

            <div class="flex space-x-1.5 items-center">

                    <p class="text-xs text-slate-400 font-bold uppercase">Social Return Ratio</p>
                    <p class="text-3xl font-extrabold text-emerald-600">~RM 6.20</p>
                    <p class="text-xs text-slate-600">Generated of verified social value per RM 1.00 spent by corporate sponsors.</p>

                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Corporate Dashboard Feed</h3>
                    <div class="flex justify-between text-xs py-1.5 border-b border-slate-100">
                        <span class="text-slate-500">Active Schools / Hubs:</span>

                    </div>

                    <div class="flex justify-between text-xs py-1.5">

                        <span class="font-bold text-emerald-600">Zero "Social-Washing"</span>
                    </div>
                </div>

        };

        function switchTab(tabKey) {
            // Update title
            const titles = {
                passport: "ChildESG Passport",
                flabee: "Flabee Care",
                lapaq: "LaPaQ Intelligence",
                sroi: "SROI & ESG Dashboard"
            };
            document.getElementById('app-title').innerText = titles[tabKey];

            // Render content
            document.getElementById('app-content').innerHTML = contentData[tabKey];

            // Update nav styles
            ['passport', 'flabee', 'lapaq', 'sroi'].forEach(key => {
                const btn = document.getElementById(`nav-${key}`);
                if (key === tabKey) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-blue-600');
                } else {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-400');
                }
            });
        }

        // Initialize default tab on load
        switchTab('passport');
    </script>
</body>
</html>
